<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Probe Hub · 探针监控</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2322c55e' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M22 12h-2.48a2 2 0 0 0-1.93 1.46l-2.35 8.36a.25.25 0 0 1-.48 0L9.24 2.18a.25.25 0 0 0-.48 0l-2.35 8.36A2 2 0 0 1 4.49 12H2'/%3E%3C/svg%3E">
<link rel="stylesheet" href="app.css">
</head>
<body>
<header class="topbar">
  <div class="wrap topbar-inner">
    <a class="brand" href="#/">
      <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M22 12h-2.48a2 2 0 0 0-1.93 1.46l-2.35 8.36a.25.25 0 0 1-.48 0L9.24 2.18a.25.25 0 0 0-.48 0l-2.35 8.36A2 2 0 0 1 4.49 12H2" /></svg>
      <span>Probe Hub</span>
    </a>
    <label class="search">
      <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="m21 21-4.34-4.34" /><circle cx="11" cy="11" r="8" /></svg>
      <input id="search" placeholder="搜索名称 / IP / 标签" autocomplete="off">
      <kbd>/</kbd>
    </label>
    <div class="top-actions">
      <span id="clock" class="clock"></span>
      <button class="icon-btn" id="forwardsBtn" title="隧道转发">
        <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="m16 3 4 4-4 4" /><path d="M20 7H4" /><path d="m8 21-4-4 4-4" /><path d="M4 17h16" /></svg>
      </button>
      <a class="icon-btn" id="pluginsBtn" href="#/plugins" title="插件中心">
        <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v17a1 1 0 0 1-1 1H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v6a1 1 0 0 1-1 1H3" /><path d="M16 19h6" /><path d="M19 22v-6" /></svg>
      </a>
      <button class="icon-btn" id="themeBtn" title="切换主题">
        <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.985 12.486a9 9 0 1 1-9.473-9.472c.405-.022.617.46.402.803a6 6 0 0 0 8.268 8.268c.344-.215.825-.004.803.401" /></svg>
      </button>
      <button class="icon-btn" id="logoutBtn" title="退出" hidden>
        <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="m16 17 5-5-5-5" /><path d="M21 12H9" /><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" /></svg>
      </button>
    </div>
  </div>
</header>

<main class="wrap" id="app"></main>

<footer class="wrap site-foot">
  <span><b>Probe Hub</b> · 轻量主机探针监控</span>
  <a href="https://github.com/Necho-dev/govmomi-wmks" target="_blank" rel="noopener">
    <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 22v-4a4.8 4.8 0 0 0-1-3.5c3 0 6-2 6-5.5.08-1.25-.27-2.48-1-3.5.28-1.15.28-2.35 0-3.5 0 0-1 0-3 1.5-2.64-.5-5.36-.5-8 0C6 2 5 2 5 2c-.3 1.15-.3 2.35 0 3.5A5.403 5.403 0 0 0 4 9c0 3.5 3 5.5 6 5.5-.39.49-.68 1.05-.85 1.65-.17.6-.22 1.23-.15 1.85v4" /><path d="M9 18c-4.51 2-5-2-7-2" /></svg>
    Necho-dev/govmomi-wmks
  </a>
</footer>

<div class="modal" id="modal" hidden>
  <div class="modal-box">
    <div class="modal-head">
      <h3 id="modalTitle"></h3>
      <div class="head-actions">
        <button class="icon-btn" id="modalFull" title="铺满页面（再次点击还原）" hidden>
          <svg class="i i-enter" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3H5a2 2 0 0 0-2 2v3" /><path d="M21 8V5a2 2 0 0 0-2-2h-3" /><path d="M3 16v3a2 2 0 0 0 2 2h3" /><path d="M16 21h3a2 2 0 0 0 2-2v-3" /></svg>
          <svg class="i i-exit" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3v3a2 2 0 0 1-2 2H3" /><path d="M21 8h-3a2 2 0 0 1-2-2V3" /><path d="M3 16h3a2 2 0 0 1 2 2v3" /><path d="M16 21v-3a2 2 0 0 1 2-2h3" /></svg>
        </button>
        <button class="icon-btn" id="modalClose" title="关闭">
          <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18" /><path d="m6 6 12 12" /></svg>
        </button>
      </div>
    </div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<div class="drawer" id="drawer" hidden>
  <div class="drawer-mask" id="drawerMask"></div>
  <aside class="drawer-panel" role="dialog" aria-modal="true">
    <div class="drawer-head">
      <div><h3 id="drawerTitle"></h3><p class="muted" id="drawerSub"></p></div>
      <button class="icon-btn" id="drawerClose" title="关闭">
        <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18" /><path d="m6 6 12 12" /></svg>
      </button>
    </div>
    <div class="drawer-body" id="drawerBody"></div>
  </aside>
</div>

<div class="login" id="login" hidden>
  <form class="login-box" id="loginForm">
    <div class="brand big"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M22 12h-2.48a2 2 0 0 0-1.93 1.46l-2.35 8.36a.25.25 0 0 1-.48 0L9.24 2.18a.25.25 0 0 0-.48 0l-2.35 8.36A2 2 0 0 1 4.49 12H2" /></svg><span>Probe Hub</span></div>
    <p class="muted">请输入管理令牌（PROBE_HUB_ADMIN_TOKEN）</p>
    <input id="tokenInput" type="password" placeholder="Admin token" autocomplete="current-password">
    <button class="btn primary" type="submit">登录</button>
    <p class="err" id="loginErr"></p>
  </form>
</div>

<script type="module" src="modules/main.js"></script>
</body>
</html>
