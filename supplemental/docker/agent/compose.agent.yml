# probe-agent on a Linux host, in a container. From the repo root:
#   GUEST_CONTROL_URL=ws://hub:8766/v1/probe/connect GUEST_TOKEN=... \
#     docker compose -f deploy/docker/compose.agent.yml up -d --build
#
# probe-agent:<version> and :latest (the default) keep the binary in the image.
# The edge tag follows hub releases. Build it with the edge stage:
#   PROBE_AGENT_TAG=edge PROBE_AGENT_TARGET=edge docker compose -f deploy/docker/compose.agent.yml up -d --build
#
# Host-wide metrics need the host's pid and network namespaces and its / at
# /hostfs (disks, os-release, machine-id). docker.sock is root-equivalent on
# the host even mounted read-only; GUEST_DOCKER decides what the agent does with it.
name: probe-agent
services:
  probe-agent:
    image: probe-agent:${PROBE_AGENT_TAG:-latest}
    build:
      context: ../..
      dockerfile: deploy/docker/probe-agent.Dockerfile
      target: ${PROBE_AGENT_TARGET:-release}
    container_name: probe-agent
    restart: unless-stopped
    network_mode: host
    pid: host
    # privileged: true          # with GUEST_HOST_NS=1
    environment:
      GUEST_CONTROL_URL: ${GUEST_CONTROL_URL:?set GUEST_CONTROL_URL, e.g. ws://hub:8766/v1/probe/connect}
      GUEST_TOKEN: ${GUEST_TOKEN:?set GUEST_TOKEN}
      GUEST_HOST_ROOT: /hostfs
      # Defaults to /hostfs/etc/hostname.
      GUEST_HOSTNAME: ${GUEST_HOSTNAME:-}
      # ro (default): containers, stats, logs. rw: also a shell inside containers. off: no Docker.
      GUEST_DOCKER: ${GUEST_DOCKER:-ro}
      # 1: the terminal and exec run on the host (nsenter into pid 1); needs privileged.
      GUEST_HOST_NS: ${GUEST_HOST_NS:-0}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Add ",rslave" to also see disks mounted after start (Docker Desktop's / is not a shared mount).
      - /:/hostfs:ro
      # Docker Desktop on Mac: bind of / does not include virtiofs /Users, so compose YAML
      # (com.docker.compose.project.config_files) is unreadable unless the home is mounted.
      # Long syntax: short "$HOME:$HOME:ro" is parsed as dest=/Users/<name>o on Docker Desktop.
      - type: bind
        source: ${HOME}
        target: ${HOME}
        read_only: true
      - probe-agent-data:/var/lib/probe-agent

volumes:
  probe-agent-data:
