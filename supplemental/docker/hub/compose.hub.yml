# vartio hub with PostgreSQL for history. From the repo root:
#   GUEST_TOKEN=... PROBE_HUB_ADMIN_TOKEN=... docker compose -f supplemental/docker/hub/compose.hub.yml up -d --build
# UI: http://<host>:8766/   agents connect to ws://<host>:8766/v1/probe/connect
# GUEST_TOKEN and PROBE_HUB_* still work; VARTIO_TOKEN / VARTIO_ADMIN_TOKEN are the new names.
services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: probe
      POSTGRES_PASSWORD: ${PROBE_DB_PASSWORD:-probe}
      POSTGRES_DB: probe
    volumes:
      - probe-pg:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U probe -d probe"]
      interval: 5s
      timeout: 3s
      retries: 20

  vartio:
    image: vartio:${VARTIO_TAG:-latest}
    build:
      context: ../../..
      dockerfile: supplemental/docker/hub/vartio.Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${PROBE_HUB_PORT:-8766}:8766"
    environment:
      PROBE_HUB_DSN: postgres://probe:${PROBE_DB_PASSWORD:-probe}@postgres:5432/probe?sslmode=disable
      GUEST_TOKEN: ${GUEST_TOKEN:?set GUEST_TOKEN}
      PROBE_HUB_ADMIN_TOKEN: ${PROBE_HUB_ADMIN_TOKEN:?set PROBE_HUB_ADMIN_TOKEN}
      PROBE_HUB_RETENTION: ${PROBE_HUB_RETENTION:-168h}
    volumes:
      - vartio-data:/data
      # Signed agent builds for remote upgrades:
      # - ../../../dist/vartio-agent:/data/dist/vartio-agent:ro

volumes:
  probe-pg:
  vartio-data:
